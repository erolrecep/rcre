name: RCRE CI & Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Sanitize (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libv4l-dev python3 python3-pip python3-numpy

      - name: Set Compiler
        run: |
          echo "CC=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Build Core Library & Binaries
        run: |
          make clean
          make

      - name: Run Unit Tests
        run: |
          make test

      - name: Run AddressSanitizer & UBSan (Clang only)
        if: matrix.compiler == 'clang'
        run: |
          make test-sanitizers

      - name: Run Hardware Acceleration Benchmark
        run: |
          make bench

      - name: Setup uv for Python Parity Tests
        uses: astral-sh/setup-uv@v5

      - name: Run Python OpenCV & Scikit-Learn Parity Verification
        run: |
          make test-parity
