name: RCRE CI & Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Sanitize (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate RCRE Project Root
        # Works in both layouts: the monorepo (project under apps/rcre) and
        # the standalone project repository (project at the repo root).
        id: locate
        run: |
          if [ -d "apps/rcre" ]; then
            echo "rcre_dir=apps/rcre" >> "$GITHUB_OUTPUT"
          else
            echo "rcre_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libv4l-dev python3 python3-pip python3-numpy

      - name: Set Compiler
        run: |
          echo "CC=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Build Core Library & Binaries
        run: |
          make -C "${{ steps.locate.outputs.rcre_dir }}" clean
          make -C "${{ steps.locate.outputs.rcre_dir }}" 

      - name: Run Unit Tests
        run: |
          make -C "${{ steps.locate.outputs.rcre_dir }}" test

      - name: Run AddressSanitizer & UBSan (Clang only)
        if: matrix.compiler == 'clang'
        run: |
          make -C "${{ steps.locate.outputs.rcre_dir }}" test-sanitizers

      - name: Run Hardware Acceleration Benchmark
        run: |
          make -C "${{ steps.locate.outputs.rcre_dir }}" bench

      - name: Setup uv for Python Parity Tests
        uses: astral-sh/setup-uv@v5

      - name: Run Python OpenCV & Scikit-Learn Parity Verification
        run: |
          make -C "${{ steps.locate.outputs.rcre_dir }}" test-parity
