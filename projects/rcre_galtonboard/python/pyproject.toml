[project]
name = "rcre-galtonboard-fastapi"
version = "1.0.0"
description = "FastAPI 3.15 Real-Time Streaming Galton Board (Quincunx) Simulation Service"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

